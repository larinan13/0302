<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование - Отель "Золотая осень"</title>
    <style>
        /* ========== БАЗОВЫЕ СТИЛИ ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; color: #2d3436; }
        a { text-decoration: none; color: inherit; }
        
        /* ========== ШАПКА ========== */
        header {
            background: linear-gradient(135deg, #0c0c1d 0%, #1a1a3e 100%);
            color: #fff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px; }
        .logo h1 span { color: #f0c27f; }
        .logo .slogan { font-size: 0.85rem; color: #b8b8d4; font-style: italic; margin-top: 2px; }
        nav { display: flex; gap: 10px; flex-wrap: wrap; }
        nav a {
            color: #b8b8d4;
            padding: 8px 20px;
            border-radius: 25px;
            transition: all 0.3s;
            font-weight: 500;
            font-size: 0.95rem;
        }
        nav a:hover, nav a.active {
            background: rgba(240, 194, 127, 0.15);
            color: #f0c27f;
        }
        nav a.active { background: #f0c27f; color: #1a1a3e; }
        
        /* ========== КОНТЕЙНЕР ========== */
        .container { max-width: 1300px; margin: 0 auto; padding: 30px 20px; }
        
        /* ========== ФОРМА ========== */
        .form-box {
            max-width: 550px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.08);
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-box h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #1a1a3e;
            font-size: 1.8rem;
        }
        
        /* Информация о номере */
        .room-info {
            background: linear-gradient(135deg, #f8f9ff, #f0f2f5);
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 25px;
            text-align: center;
            border-left: 4px solid #667eea;
        }
        .room-info h3 { color: #1a1a3e; }
        .room-info .price { font-size: 1.2rem; font-weight: 700; color: #667eea; }
        .room-info .feat { font-size: 0.85rem; color: #666; margin-top: 5px; }
        .room-info .empty { color: #999; }
        
        /* Поля формы */
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #1a1a3e;
            font-size: 0.95rem;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8ecf1;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        .form-group input.error-input, .form-group textarea.error-input {
            border-color: #e74c3c;
        }
        .error {
            color: #e74c3c;
            font-size: 0.82rem;
            display: none;
            margin-top: 5px;
        }
        .error.show { display: block; }
        
        /* Кнопки */
        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        .btn-submit {
            flex: 1;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            padding: 14px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.35);
        }
        .btn-reset {
            flex: 1;
            background: transparent;
            color: #555;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-reset:hover { background: #f0f2f5; }
        
        /* Успех */
        .success {
            display: none;
            text-align: center;
            padding: 40px 30px;
            background: linear-gradient(135deg, #d4edda, #b7e4c7);
            border-radius: 16px;
            color: #155724;
        }
